# Driftwatch control server behind your own reverse proxy (e.g. nginx on a
# Raspberry Pi), reachable on your LAN. Tailscale is only used by the control
# server to reach agents on other machines.
#
# Before starting:
#   1. Create a Tailscale auth key and put it in .env as TS_AUTHKEY=tskey-auth-...
#   2. Set DRIFTWATCH_PUBLIC_URL below to the HTTPS URL nginx serves.
#      Passkeys need HTTPS and are bound to that host name.
#   3. Add the nginx site from nginx.conf in this folder.
#
# Then: docker compose up -d
#       docker exec -it driftwatch driftwatch invite   # one-time passkey link
#
# Prefer to reach the UI over Tailscale only? See compose.tailscale-serve.yaml.

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: driftwatch-tailscale
    hostname: driftwatch
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: driftwatch
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    # driftwatch shares this container's network, so its port is published
    # here. nginx on the host proxies to http://127.0.0.1:8080.
    #
    # If nginx itself runs in a container, drop `ports` and instead join this
    # service to nginx's network, then proxy to http://driftwatch-tailscale:8080:
    #   networks: [proxy]
    # and at the bottom of the file:
    #   networks:
    #     proxy:
    #       external: true
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  driftwatch:
    image: ghcr.io/moudoux/driftwatch:latest
    container_name: driftwatch
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      DRIFTWATCH_MODE: control
      DRIFTWATCH_PUBLIC_URL: https://logs.example.lan
      DRIFTWATCH_HTTP_LISTEN: 0.0.0.0:8080
      # Also show this machine's containers.
      DRIFTWATCH_LOCAL: "true"
      # Resolve agent names with MagicDNS; short names like driftwatch-nas get
      # this suffix (find it on the DNS page of the Tailscale admin console).
      DRIFTWATCH_DNS: 100.100.100.100
      DRIFTWATCH_TAILNET: YOUR-TAILNET.ts.net
    volumes:
      - driftwatch-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  tailscale-state:
  driftwatch-data:
