# Driftwatch control server.
#
# Runs on one machine (e.g. a Raspberry Pi). It serves the web UI over HTTPS on
# your tailnet via Tailscale Serve, connects out to every agent, and also
# collects this machine's own container logs (DRIFTWATCH_LOCAL).
#
# Before starting:
#   1. In the Tailscale admin console enable MagicDNS and HTTPS certificates.
#   2. Create an auth key and put it in .env as TS_AUTHKEY=tskey-auth-...
#   3. Set DRIFTWATCH_PUBLIC_URL below to https://driftwatch.<your-tailnet>.ts.net
#
# Then: docker compose up -d
#       docker exec -it driftwatch driftwatch invite   # one-time passkey link

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: driftwatch-tailscale
    hostname: driftwatch
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: driftwatch
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_SERVE_CONFIG: /config/serve.json
    configs:
      - source: tailscale-serve
        target: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  driftwatch:
    image: ghcr.io/moudoux/driftwatch:latest
    container_name: driftwatch
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      DRIFTWATCH_MODE: control
      DRIFTWATCH_PUBLIC_URL: https://driftwatch.YOUR-TAILNET.ts.net
      # Only reachable through Tailscale Serve inside the shared network namespace.
      DRIFTWATCH_HTTP_LISTEN: 127.0.0.1:8080
      # Also show this machine's containers.
      DRIFTWATCH_LOCAL: "true"
      # Resolve agent names with MagicDNS.
      DRIFTWATCH_DNS: 100.100.100.100
    volumes:
      - driftwatch-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

configs:
  tailscale-serve:
    # `$$` is compose's escape for a literal `$`; Tailscale fills in TS_CERT_DOMAIN.
    content: |
      {"TCP": {"443": {"HTTPS": true}},
       "Web": {"$${TS_CERT_DOMAIN}:443": {"Handlers": {"/": {"Proxy": "http://127.0.0.1:8080"}}}}}

volumes:
  tailscale-state:
  driftwatch-data:
