# Example nginx site for the Driftwatch control server.
# Passkeys only work over HTTPS, so serve it with a certificate your browsers
# trust (a local CA, or Let's Encrypt via a DNS challenge).
#
# server_name must match the host in DRIFTWATCH_PUBLIC_URL.

server {
    listen 443 ssl;
    http2 on;
    server_name logs.example.lan;

    ssl_certificate     /etc/nginx/certs/logs.example.lan.crt;
    ssl_certificate_key /etc/nginx/certs/logs.example.lan.key;

    location / {
        # nginx running in Docker? Use http://driftwatch-tailscale:8080 instead.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # Live log streams (server-sent events) must not be buffered and
        # stay open for a long time.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}

server {
    listen 80;
    server_name logs.example.lan;
    return 301 https://$host$request_uri;
}
