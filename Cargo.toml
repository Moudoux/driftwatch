[package]
name = "driftwatch"
version = "0.1.0"
edition = "2024"
description = "Live Docker log streaming across machines over Tailscale and mutual TLS"
rust-version = "1.88"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
ciborium = "0.2.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "service"] }
mime_guess = "2.0.5"
p256 = "0.14.0"
rand = "0.10.4"
rcgen = { version = "0.14.10", features = ["x509-parser", "pem", "ring"] }
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
rust-embed = "8.14.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1.16.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = { version = "0.3.55", features = ["parsing", "formatting"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = { version = "0.1.19", features = ["time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
x509-parser = "0.18.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
